services:
  - type: web
    name: buildpc3d-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GROQ_ENABLED
        value: "false"
      - key: IP_PER_HOUR
        value: "10"
      - key: GLOBAL_PER_DAY
        value: "100"
      - key: MAX_CONCURRENT
        value: "2"
